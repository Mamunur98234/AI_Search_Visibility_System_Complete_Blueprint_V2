[project]
name = "aisv-api"
version = "0.1.0"
description = "AI Search Visibility System - API (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pydantic[email]==2.14.3",
  "pydantic-settings==2.16.3",
  "argon2-cffi==25.1.0",
  "pyotp==2.12.0",
  "cryptography==50.0.2",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5", "mypy==2.4.1", "pip-audit==2.10.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
