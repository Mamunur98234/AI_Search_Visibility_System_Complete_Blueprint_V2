name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create database roles
        run: PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../../infra/postgres/init-roles.sql
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Type check
        run: mypy app
      - name: Tests (real PostgreSQL with RLS)
        run: pytest -q
      - name: OpenAPI contract is up to date
        run: python -m scripts.export_openapi && git diff --exit-code openapi.json
      - name: Dependency audit
        run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Database roles and e2e schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/postgres/init-roles.sql
          cd apps/api && python -m venv .venv && .venv/bin/pip install -e .
          MIGRATION_DATABASE_URL=postgresql+psycopg://aisv_owner:change-me-owner@localhost:5432/aisv_e2e .venv/bin/alembic upgrade head
      - name: Install web deps and browser
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Playwright (real stack)
        working-directory: apps/web
        run: npx playwright test
